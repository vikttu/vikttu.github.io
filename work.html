---
layout: page
---
{% for category in site.categories %}
<section>
  <label>{{ category[0] }}</label>
    {% for post in site.posts %}
      <div>
        <a href="{{ post.url }}" class="preview-post-title">
          <img src="{{ post.img }}" class="preview-post-cover" />
          <h2>
            {{ post.title }}
          </h2>
        </a>
        <p>
          {{ post.excerpt }}
        </p>
        <div>
          <h4>Tags:</h4>
          {% for tag in site.tags %}
          <label>{{ tag[0] }}</label>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </section>
{% endfor %}
